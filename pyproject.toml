[project]
name = "w3-quest-tracker"
version = "0.1.0"
description = "Quest tracker for The Witcher 3 that follows your newest save file"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Faster decompression; a pure-Python LZ4 fallback is used without it.
fast = ["lz4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/w3qt"]
